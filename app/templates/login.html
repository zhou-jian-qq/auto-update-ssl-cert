<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录 - {{ settings.app_name }}</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100">
  <div class="grid min-h-screen place-items-center px-4">
    <div class="w-full max-w-md rounded-2xl border border-white/10 bg-white/[.06] p-8 shadow-2xl shadow-cyan-950/40 backdrop-blur">
      <div class="mb-8">
        <div class="mb-4 grid h-12 w-12 place-items-center rounded-xl bg-cyan-400 text-lg font-black text-slate-950">SSL</div>
        <h1 class="text-2xl font-semibold">{{ settings.app_name }}</h1>
        <p class="mt-2 text-sm text-slate-400">登录后管理行方接口证书监控与候选证书。</p>
      </div>
      {% if error %}
      <div class="mb-4 rounded-lg border border-red-400/30 bg-red-400/10 px-4 py-3 text-sm text-red-200">{{ error }}</div>
      {% endif %}
      <form method="post" action="/login" class="space-y-4">
        <label class="block">
          <span class="text-sm text-slate-300">用户名</span>
          <input name="username" required class="mt-1 w-full rounded-lg border border-white/10 bg-slate-900 px-3 py-2 outline-none ring-cyan-400/50 focus:ring-2">
        </label>
        <label class="block">
          <span class="text-sm text-slate-300">密码</span>
          <input name="password" type="password" required class="mt-1 w-full rounded-lg border border-white/10 bg-slate-900 px-3 py-2 outline-none ring-cyan-400/50 focus:ring-2">
        </label>
        <button class="w-full rounded-lg bg-cyan-400 px-4 py-2.5 font-semibold text-slate-950 hover:bg-cyan-300">登录</button>
      </form>
    </div>
  </div>
</body>
</html>
