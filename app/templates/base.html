<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ settings.app_name }}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body class="min-h-screen bg-slate-950 text-slate-100">
  <div class="fixed inset-0 bg-[radial-gradient(circle_at_20%_20%,rgba(45,212,191,.16),transparent_28%),radial-gradient(circle_at_80%_10%,rgba(96,165,250,.14),transparent_28%)] pointer-events-none"></div>
  <div class="relative min-h-screen">
    <aside class="fixed inset-y-0 left-0 hidden w-72 border-r border-white/10 bg-slate-950/85 px-5 py-6 backdrop-blur lg:block">
      <div class="flex items-center gap-3">
        <div class="grid h-11 w-11 place-items-center rounded-lg bg-cyan-400 text-slate-950 font-black">SSL</div>
        <div>
          <p class="text-base font-semibold">{{ settings.app_name }}</p>
          <p class="text-xs text-slate-400">Bank certificate monitor</p>
        </div>
      </div>
      <nav class="mt-8 space-y-2">
        <a href="/" class="flex items-center rounded-lg px-3 py-2 text-sm font-medium text-slate-200 hover:bg-white/10">仪表盘</a>
        <a href="/banks/new" class="flex items-center rounded-lg px-3 py-2 text-sm font-medium text-slate-200 hover:bg-white/10">新增银行接口</a>
      </nav>
      <div class="absolute bottom-6 left-5 right-5 rounded-lg border border-white/10 bg-white/[.04] p-4">
        <p class="text-sm font-medium">当前用户</p>
        <p class="mt-1 text-sm text-slate-400">{{ user }}</p>
        <form method="post" action="/logout" class="mt-3">
          <button class="w-full rounded-lg border border-white/10 px-3 py-2 text-sm text-slate-200 hover:bg-white/10">退出登录</button>
        </form>
      </div>
    </aside>
    <main class="lg:pl-72">
      <header class="sticky top-0 z-20 border-b border-white/10 bg-slate-950/80 px-4 py-4 backdrop-blur lg:hidden">
        <div class="flex items-center justify-between">
          <a href="/" class="font-semibold">{{ settings.app_name }}</a>
          <form method="post" action="/logout">
            <button class="rounded-lg border border-white/10 px-3 py-2 text-sm">退出</button>
          </form>
        </div>
      </header>
      <div class="mx-auto max-w-7xl px-4 py-6 sm:px-6 lg:px-8">
        {% block content %}{% endblock %}
      </div>
    </main>
  </div>
</body>
</html>
